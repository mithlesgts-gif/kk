    <style>
      /* Suppress Netlify Injected Badge and Collaborative Drawer */
      #netlify-feedback-root,
      [data-netlify-deploy-preview-badge],
      #netlify-deploy-preview-badge,
      .netlify-badge,
      iframe[src*="netlify"],
      iframe[id*="netlify"],
      iframe[title*="Netlify" i],
      iframe[aria-label*="Netlify" i],
      div[class*="netlify-badge" i],
      div[id*="netlify" i],
      div[class*="netlify-drawer" i],
      div[id*="netlify-drawer" i],
      div[data-netlify],
      a[href*="netlify.com"][class*="badge" i] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        position: absolute !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function() {
        const removeNetlifyBadge = () => {
          const selectors = [
            '#netlify-feedback-root',
            '[data-netlify-deploy-preview-badge]',
            '#netlify-deploy-preview-badge',
            '.netlify-badge',
            'iframe[src*="netlify"]',
            'iframe[id*="netlify"]',
            'iframe[title*="Netlify" i]',
            'iframe[aria-label*="Netlify" i]',
            'div[class*="netlify-badge" i]',
            'div[id*="netlify" i]',
            'div[class*="netlify-drawer" i]',
            'div[id*="netlify-drawer" i]',
            'div[data-netlify]',
            'a[href*="netlify.com"][class*="badge" i]'
          ];
          selectors.forEach(sel => {
            document.querySelectorAll(sel).forEach(el => {
              try {
                el.style.setProperty('display', 'none', 'important');
                el.remove();
              } catch (_) {}
            });
          });
        };

        if (typeof window !== 'undefined') {
          // Run immediately
          removeNetlifyBadge();
          // Watch for late edge-injected elements
          const observer = new MutationObserver(() => removeNetlifyBadge());
          if (document.documentElement) {
            observer.observe(document.documentElement, { childList: true, subtree: true });
          }
          window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
          window.addEventListener('load', removeNetlifyBadge);
        }
      })();
    </script>
  </head>
